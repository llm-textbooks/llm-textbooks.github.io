parts:
  - title: "I부. 왜 추론 서버가 필요한가"
    question: "한 요청은 왜 단순한 model.forward 호출이 아니라 여러 소유자와 대기열을 지나는가?"
    promise: "지연·처리량·goodput을 같은 숫자로 뭉개지 않고, 요청의 전 구간에서 비용과 최초 불일치를 찾는다."
    prerequisites: ["LLM API를 한 번 호출해 본 경험", "기본적인 CPU·GPU 구분"]
    routes:
      straight: "1장부터 5장까지 읽으며 요청 여정, TTFT·ITL, goodput, prefill/decode 비용과 소스 읽기 원칙을 차례로 세운다."
      operations: "2장과 3장을 먼저 읽고 SLO·queue·goodput 판정표를 만든 뒤 1장과 4장으로 원인을 역추적한다."
      source_digging: "5장의 claim→source→measurement 방법을 먼저 익힌 뒤 1장과 4장의 경계를 실제 함수 좌표에 연결한다."
    exit_artifact: "요청 한 건의 단계·소유자·시각·비용을 적은 request journey ledger"
    next_handoff: "이제 같은 문자열이 실제로 어떤 token IDs와 첫 hidden state가 되는지 II부에서 추적한다."
    chapters: &part01
