# Canonical publication manifest for the 78-chapter Korean reader spine.
# This is intentionally separate from book.yaml and its legacy EPUB output.
title: "CUDA로 내려가며 읽는 LLM 추론 서버"
subtitle: "요청·스케줄러·KV 캐시·분산 실행·CUDA 커널을 원본 소스로 추적하기"
series: "LLM 시스템 메커니즘"
volume: 1
subjects:
  - "대규모 언어 모델 추론"
  - "GPU·CUDA 프로그래밍"
  - "분산 시스템과 모델 서빙"
lang: ko-KR
edition: next-spine-preview-0.1
date: 2026-08-23
rights: "Draft — source citations and licenses are tracked per chapter"
description: "HTTP 요청과 tokenizer에서 scheduler, KV cache, model forward, CUDA kernel, GPU network 및 운영 진단까지 소스와 공식 문서를 따라 추적하는 한국어 기술서"
include_ontology_catalog: false
output: cuda-llm-serving-ko-next-spine-preview.epub
