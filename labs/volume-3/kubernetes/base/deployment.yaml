apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
  labels:
    app.kubernetes.io/name: agent-api
    app.kubernetes.io/part-of: volume3-kubernetes-lab
spec:
  replicas: 2
  minReadySeconds: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-api
        app.kubernetes.io/part-of: volume3-kubernetes-lab
    spec:
      serviceAccountName: agent-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: agent-api
          # This is a disposable HTTP fixture, not an AgentRun image and not a
          # receiver.  Pin it before a real staging exercise.
          image: busybox:1.36.1
          command: ["/bin/sh", "-ec", "exec httpd -f -p 8080 -h /tmp"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: writable-tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # A real AgentRun worker must close intake and persist its
                # drain marker here; this fixture only proves hook syntax.
                command: ["/bin/sh", "-ec", "echo preStop-hook-ran >&2; sleep 5"]
      volumes:
        - name: writable-tmp
          emptyDir: {}
