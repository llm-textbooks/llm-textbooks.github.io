apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-api
  labels:
    app.kubernetes.io/name: agent-api
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-api-read-contract
rules:
  # Deliberately narrow: a real worker should not need to list Pods merely to
  # execute a run.  This grants only the named ConfigMap contract lookup.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["agent-api-contract"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-api-read-contract
subjects:
  - kind: ServiceAccount
    name: agent-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-api-read-contract
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-api-contract
data:
  schema-revision: "1"
  policy-revision: "lab-only"
  receiver-contract: "No external receiver is called by this manifest."
